name: CI

# Checks on every pull request to main. The job names are required status checks of the
# repository ruleset "main": renaming a job means updating the ruleset too.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# The commits of the pull request: BASE..HEAD (Commit messages) and BASE...HEAD (Gradle test).
env:
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oldest Python the skill supports (README, Requirements) and the newest stable one
      # (3.x, so a new release is picked up without editing this file). Both in one job, so the
      # required check keeps its name. The last version listed is the default `python`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.9
            3.x
      - name: Tests on Python 3.9
        run: python3.9 -m unittest discover skills/android-upstream-audit/scripts/tests
      - name: Tests on the newest Python
        if: success() || failure()
        run: python -m unittest discover skills/android-upstream-audit/scripts/tests

  plugin-validation:
    name: Plugin validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version and every dependency are pinned in .github/tools/claude-code/package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/tools/claude-code/package-lock.json
      - run: npm ci --prefix .github/tools/claude-code --no-audit --no-fund
      # No API key: validate reads local files only. Fails on ✘ problems, including what the
      # plugin directory would refuse (--profile directory); warnings (⚠) pass.
      - run: .github/tools/claude-code/node_modules/.bin/claude plugin validate . --profile directory

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # The version and every dependency are pinned in .github/tools/commitlint/package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/tools/commitlint/package-lock.json
      - run: npm ci --prefix .github/tools/commitlint --no-audit --no-fund
      - name: Conventional Commits (AGENTS.md "Commits")
        run: >
          .github/tools/commitlint/node_modules/.bin/commitlint
          --config .github/commitlint.config.mjs
          --from "$BASE" --to "$HEAD" --verbose
      # Runs even when commitlint fails, so both problems are reported at once.
      - name: No merge commits, no unsquashed fixups
        if: success() || failure()
        run: |
          status=0
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::Merge commits in the pull request; rebase on main instead:"
            git log --format='  %h %s' --merges "$BASE..$HEAD"
            status=1
          fi
          fixups=$(git log --format='%h %s' "$BASE..$HEAD" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! ' || true)
          if [ -n "$fixups" ]; then
            echo "::error::Unsquashed commits; fold them with git rebase -i --autosquash:"
            echo "$fixups" | sed 's/^/  /'
            status=1
          fi
          exit $status

  gradle-test:
    # Always runs, so it can be a required check; Gradle runs only when the init script, the code
    # that runs it and reads its output (facts.py, common.py), the Gradle test and its fixtures or
    # this workflow changes.
    name: Gradle test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Did the Gradle side change?
        id: changes
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qxE 'skills/android-upstream-audit/scripts/(audit-facts\.init\.gradle|facts\.py|common\.py|tests/test_facts\.py|tests/fixtures\.py)|\.github/workflows/ci\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the Gradle test depends on changed: nothing to run."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.7.1'
      - if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover skills/android-upstream-audit/scripts/tests
        env:
          RUN_GRADLE_TESTS: '1'
